[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ibvap-ai-service"
version = "0.1.0"
description = "Software-defined video analytics service for existing CCTV streams"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "opencv-python>=4.10,<5",
    "numpy>=1.26,<3",
    "onnxruntime>=1.19,<2",
    "supervision>=0.25,<0.28",
    "pytesseract>=0.3.13,<1",
    "python-multipart>=0.0.20,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]
